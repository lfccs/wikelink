# Every push: clippy without warnings and the tests with the committed Cargo.lock (Windows,
# where the exe lives), the three platform-neutral crates also on Linux and on the oldest
# Rust they promise (`rust-version`), dependency advisories, and a short fuzz run over the
# parsers that read other people's data. No `cargo fmt` step: the code was never formatted
# with rustfmt and a formatting-only commit would hide history; do that once, on its own.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# Read the code, nothing more: no job here writes to the repository.
permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked

  # wikelo-core, wikelo-log and wikelo-install do not depend on Windows: kept building elsewhere.
  shared-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Tests of the shared crates
        run: cargo test -p wikelo-core -p wikelo-log -p wikelo-install --locked

  # `rust-version` in Cargo.toml is a promise; this is where it is kept.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Shared crates build on the minimum supported Rust
        run: cargo +1.88.0 check -p wikelo-core -p wikelo-log -p wikelo-install --locked

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit --file Cargo.lock

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz -> target
      - name: cargo-fuzz (cached in ~/.cargo/bin by rust-cache after the first run)
        run: cargo +nightly install cargo-fuzz --locked
      - name: Fuzz the dataset, Game.log and manifest parsers (60 s each)
        run: |
          for t in dataset_json log_lines bundle_manifest; do
            cargo +nightly fuzz run "$t" -- -max_total_time=60 -timeout=10 -rss_limit_mb=2048
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
